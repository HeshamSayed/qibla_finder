name: qibla_finder
description: قبلتي - Qiblati - اتجاه القبلة بدقة مع أوقات الصلاة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Location & Compass
  geolocator: ^10.1.0
  flutter_compass: ^0.8.0
  permission_handler: ^11.0.1
  geocoding: ^2.1.1

  # Prayer Times
  adhan: ^2.1.0

  # UI
  flutter_svg: ^2.0.9
  lottie: ^2.7.0

  # AdMob
  google_mobile_ads: ^4.0.0

  # Storage
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.18.1
  vector_math: ^2.1.4
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
